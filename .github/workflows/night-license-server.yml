name: Night License Server

on:
  workflow_dispatch:
  push:
    branches: ["night"]
    paths:
      - 'license-server/**'
      - '.github/workflows/night-license-server.yml'
  pull_request:
    paths:
      - 'license-server/**'
      - '.github/workflows/night-license-server.yml'

concurrency:
  group: night-license-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  protocol:
    name: Protocol test
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ./license-server
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Boot server and run end-to-end flow
        env:
          NIGHT_ADMIN_TOKEN: test-admin-token
          NIGHT_MEMORY_SECRET: test-memory-secret
          NIGHT_DATA: ${{ runner.temp }}/night.json
          NIGHT_PORT: "8080"
          BASE: http://127.0.0.1:8080
        run: |
          node server.mjs &
          SERVER_PID=$!
          for i in $(seq 1 40); do
            if curl -fsS "$BASE/api/health" >/dev/null 2>&1; then break; fi
            sleep 0.25
          done
          node test-e2e.mjs
          kill $SERVER_PID
      - name: Reject cleartext endpoints in the client
        working-directory: .
        run: |
          if grep -rn "http://" manager/app/src/main/java/me/weishu/kernelsu/ui/activation/ ; then
            echo "::error::client must not reference cleartext endpoints"
            exit 1
          fi

  package:
    name: Package deploy bundle
    needs: protocol
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Assemble bundle
        run: |
          mkdir -p out
          cp license-server/server.mjs license-server/install.sh license-server/README.md out/
          sha256sum out/* > out/SHA256SUMS
          cat out/SHA256SUMS
      - uses: actions/upload-artifact@v4
        with:
          name: night-license-server
          path: out/
          retention-days: 30

  deploy:
    name: Deploy to VPS
    needs: protocol
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Push server and restart service
        env:
          SSH_KEY: ${{ secrets.NIGHT_VPS_SSH_KEY }}
          SSH_HOST: ${{ secrets.NIGHT_VPS_HOST }}
          SSH_USER: ${{ secrets.NIGHT_VPS_USER }}
        run: |
          if [ -z "$SSH_KEY" ] || [ -z "$SSH_HOST" ] || [ -z "$SSH_USER" ]; then
            echo "::warning::NIGHT_VPS_SSH_KEY / NIGHT_VPS_HOST / NIGHT_VPS_USER not set; skipping deploy"
            exit 0
          fi
          install -d -m 700 ~/.ssh
          printf '%s\n' "$SSH_KEY" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519
          ssh-keyscan -H "$SSH_HOST" >> ~/.ssh/known_hosts 2>/dev/null || true
          scp -o StrictHostKeyChecking=accept-new \
            license-server/server.mjs license-server/install.sh \
            "$SSH_USER@$SSH_HOST:/tmp/"
          ssh -o StrictHostKeyChecking=accept-new "$SSH_USER@$SSH_HOST" 'bash /tmp/install.sh'
      - name: Verify public health endpoint
        env:
          SSH_HOST: ${{ secrets.NIGHT_VPS_HOST }}
        run: |
          if [ -z "$SSH_HOST" ]; then exit 0; fi
          curl -fsS "https://night.${SSH_HOST}.nip.io/api/health" || curl -fsS "http://${SSH_HOST}/api/health"
