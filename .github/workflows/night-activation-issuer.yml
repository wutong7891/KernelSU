name: Build XhovoSU Card-Key Issuer

# Builds the offline licence issuer. Licences are ECDSA P-256 tokens signed by
# the issuer and verified inside the Manager; nothing here talks to a server.

on:
  workflow_dispatch:
  push:
    branches: ["night", "codex/night-offline-license"]
    paths:
      - '.github/workflows/night-activation-issuer.yml'
      - 'manager/activation-issuer/**'
      - 'tools/xhovosu-cardkey/**'
      - 'scripts/update_cardkey_secret.py'

permissions:
  contents: read

jobs:
  issuer-format:
    name: Licence format self-test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Run issuer self-test
        working-directory: ./tools/xhovosu-cardkey
        run: node test.mjs
      - name: Check the gate wiring
        working-directory: ./tools/xhovosu-cardkey
        run: node contract.mjs

  android-issuer:
    needs: issuer-format
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ./manager
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: 21
      - uses: gradle/actions/setup-gradle@v6
      - uses: android-actions/setup-android@v4
      - name: Embed XhovoSU card-key signing key
        working-directory: .
        env:
          XHOVO_CARDKEY_SECRET_B64: ${{ secrets.XHOVO_CARDKEY_SECRET_B64 }}
        run: |
          if [ -n "$XHOVO_CARDKEY_SECRET_B64" ]; then
            mkdir -p manager/activation-issuer/src/main/assets
            echo "$XHOVO_CARDKEY_SECRET_B64" | base64 -d > manager/activation-issuer/src/main/assets/xhovo_cardkey_secret.bin
            python3 scripts/update_cardkey_secret.py --secret "$XHOVO_CARDKEY_SECRET_B64"
          else
            echo "::warning::XHOVO_CARDKEY_SECRET_B64 not set; building a development issuer that only matches the repository default secret"
          fi
      - name: Write stable signing key
        env:
          NIGHT_KEYSTORE: ${{ secrets.NIGHT_KEYSTORE }}
          NIGHT_KEYSTORE_PASSWORD: ${{ secrets.NIGHT_KEYSTORE_PASSWORD }}
          NIGHT_KEY_ALIAS: ${{ secrets.NIGHT_KEY_ALIAS }}
          NIGHT_KEY_PASSWORD: ${{ secrets.NIGHT_KEY_PASSWORD }}
        run: |
          test -n "$NIGHT_KEYSTORE"
          echo "$NIGHT_KEYSTORE" | base64 -d > night-key.jks
          {
            echo KEYSTORE_PASSWORD="$NIGHT_KEYSTORE_PASSWORD"
            echo KEY_ALIAS="$NIGHT_KEY_ALIAS"
            echo KEY_PASSWORD="$NIGHT_KEY_PASSWORD"
            echo KEYSTORE_FILE=night-key.jks
          } >> gradle.properties
      - name: Build Android issuer
        run: ./gradlew :activation-issuer:assembleRelease
      - name: Upload Android issuer
        uses: actions/upload-artifact@v7
        with:
          name: XhovoSU-CardKey-Issuer-Android
          path: manager/activation-issuer/build/outputs/apk/release/*.apk
