name: Build Night Activation Issuers

on:
  workflow_dispatch:
  push:
    branches: ["night"]
    paths:
      - '.github/workflows/night-activation-issuer.yml'
      - 'manager/activation-issuer/**'
      - 'tools/night-activation-issuer/**'

permissions:
  contents: read

jobs:
  windows-issuer:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7
      - name: Build Windows issuer
        run: dotnet build tools/night-activation-issuer/NightActivationIssuer.csproj -c Release
      - name: Upload Windows issuer
        uses: actions/upload-artifact@v7
        with:
          name: Night-Activation-Issuer-Windows
          path: tools/night-activation-issuer/bin/Release/net48/Night-Activation-Issuer.exe

  android-issuer:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ./manager
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: 21
      - uses: gradle/actions/setup-gradle@v6
      - uses: android-actions/setup-android@v4
      - name: Embed Night activation PEM and PK8
        env:
          NIGHT_ACTIVATION_PRIVATE_KEY_PEM: ${{ secrets.NIGHT_ACTIVATION_PRIVATE_KEY_PEM }}
          NIGHT_ACTIVATION_PRIVATE_KEY_PK8: ${{ secrets.NIGHT_ACTIVATION_PRIVATE_KEY_PK8 }}
        run: |
          test -n "$NIGHT_ACTIVATION_PRIVATE_KEY_PEM"
          test -n "$NIGHT_ACTIVATION_PRIVATE_KEY_PK8"
          mkdir -p activation-issuer/src/main/assets
          echo "$NIGHT_ACTIVATION_PRIVATE_KEY_PEM" | base64 -d > activation-issuer/src/main/assets/night_activation_private_key.pem
          echo "$NIGHT_ACTIVATION_PRIVATE_KEY_PK8" | base64 -d > activation-issuer/src/main/assets/night_activation_private_key.pk8
      - name: Write stable Night signing key
        env:
          NIGHT_KEYSTORE: ${{ secrets.NIGHT_KEYSTORE }}
          NIGHT_KEYSTORE_PASSWORD: ${{ secrets.NIGHT_KEYSTORE_PASSWORD }}
          NIGHT_KEY_ALIAS: ${{ secrets.NIGHT_KEY_ALIAS }}
          NIGHT_KEY_PASSWORD: ${{ secrets.NIGHT_KEY_PASSWORD }}
        run: |
          test -n "$NIGHT_KEYSTORE"
          echo "$NIGHT_KEYSTORE" | base64 -d > night-key.jks
          {
            echo KEYSTORE_PASSWORD="$NIGHT_KEYSTORE_PASSWORD"
            echo KEY_ALIAS="$NIGHT_KEY_ALIAS"
            echo KEY_PASSWORD="$NIGHT_KEY_PASSWORD"
            echo KEYSTORE_FILE=night-key.jks
          } >> gradle.properties
      - name: Build Android issuer
        run: ./gradlew :activation-issuer:assembleRelease
      - name: Upload Android issuer
        uses: actions/upload-artifact@v7
        with:
          name: Night-Activation-Issuer-Android
          path: manager/activation-issuer/build/outputs/apk/release/*.apk
