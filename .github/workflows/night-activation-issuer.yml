name: Build Night Offline Issuer

# Builds the offline licence issuer. Licences are ECDSA P-256 tokens signed by
# the issuer and verified inside the Manager; nothing here talks to a server.

on:
  workflow_dispatch:
  push:
    branches: ["night"]
    paths:
      - '.github/workflows/night-activation-issuer.yml'
      - 'manager/activation-issuer/**'
      - 'tools/night-offline-issuer/**'
      - 'scripts/update_night_license_pubkey.py'

permissions:
  contents: read

jobs:
  issuer-format:
    name: Licence format self-test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Run issuer self-test
        working-directory: ./tools/night-offline-issuer
        run: node test.mjs

  android-issuer:
    needs: issuer-format
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ./manager
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: 21
      - uses: gradle/actions/setup-gradle@v6
      - uses: android-actions/setup-android@v4
      - name: Embed Night licence signing key
        working-directory: .
        env:
          NIGHT_LICENSE_PRIVATE_KEY_B64: ${{ secrets.NIGHT_LICENSE_PRIVATE_KEY_B64 }}
          NIGHT_LICENSE_PUBKEY_DER_B64: ${{ secrets.NIGHT_LICENSE_PUBKEY_DER_B64 }}
        run: |
          if [ -n "$NIGHT_LICENSE_PRIVATE_KEY_B64" ] && [ -n "$NIGHT_LICENSE_PUBKEY_DER_B64" ]; then
            mkdir -p manager/activation-issuer/src/main/assets
            echo "$NIGHT_LICENSE_PRIVATE_KEY_B64" | base64 -d > manager/activation-issuer/src/main/assets/night_license_private_key.pk8
            echo "$NIGHT_LICENSE_PUBKEY_DER_B64" | base64 -d > manager/activation-issuer/src/main/assets/night_license_public_key.der
            python3 scripts/update_night_license_pubkey.py --key "$NIGHT_LICENSE_PUBKEY_DER_B64"
          else
            echo "::warning::NIGHT_LICENSE_PRIVATE_KEY_B64 / NIGHT_LICENSE_PUBKEY_DER_B64 not set; building a development issuer that cannot sign production licences"
          fi
      - name: Write stable Night signing key
        env:
          NIGHT_KEYSTORE: ${{ secrets.NIGHT_KEYSTORE }}
          NIGHT_KEYSTORE_PASSWORD: ${{ secrets.NIGHT_KEYSTORE_PASSWORD }}
          NIGHT_KEY_ALIAS: ${{ secrets.NIGHT_KEY_ALIAS }}
          NIGHT_KEY_PASSWORD: ${{ secrets.NIGHT_KEY_PASSWORD }}
        run: |
          test -n "$NIGHT_KEYSTORE"
          echo "$NIGHT_KEYSTORE" | base64 -d > night-key.jks
          {
            echo KEYSTORE_PASSWORD="$NIGHT_KEYSTORE_PASSWORD"
            echo KEY_ALIAS="$NIGHT_KEY_ALIAS"
            echo KEY_PASSWORD="$NIGHT_KEY_PASSWORD"
            echo KEYSTORE_FILE=night-key.jks
          } >> gradle.properties
      - name: Build Android issuer
        run: ./gradlew :activation-issuer:assembleRelease
      - name: Upload Android issuer
        uses: actions/upload-artifact@v7
        with:
          name: Night-Offline-Issuer-Android
          path: manager/activation-issuer/build/outputs/apk/release/*.apk
