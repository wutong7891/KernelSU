name: Prepare Night Web Patch Engine

on:
  workflow_dispatch:

permissions:
  actions: read
  contents: write

jobs:
  resolve-night-certificate:
    runs-on: ubuntu-latest
    outputs:
      expected_size: ${{ steps.cert.outputs.expected_size }}
      expected_hash: ${{ steps.cert.outputs.expected_hash }}
    steps:
      - name: Export Night signing certificate identity
        id: cert
        env:
          NIGHT_KEYSTORE: ${{ secrets.NIGHT_KEYSTORE }}
          NIGHT_KEYSTORE_PASSWORD: ${{ secrets.NIGHT_KEYSTORE_PASSWORD }}
          NIGHT_KEY_ALIAS: ${{ secrets.NIGHT_KEY_ALIAS }}
        run: |
          set -euo pipefail
          test -n "$NIGHT_KEYSTORE"
          test -n "$NIGHT_KEYSTORE_PASSWORD"
          test -n "$NIGHT_KEY_ALIAS"
          echo "$NIGHT_KEYSTORE" | base64 -d > night-key.jks
          keytool -exportcert -alias "$NIGHT_KEY_ALIAS" -keystore night-key.jks -storepass "$NIGHT_KEYSTORE_PASSWORD" -file night-cert.der
          size_dec=$(stat -c%s night-cert.der)
          echo "expected_size=$(printf '0x%04x' "$size_dec")" >> "$GITHUB_OUTPUT"
          echo "expected_hash=$(sha256sum night-cert.der | awk '{print $1}')" >> "$GITHUB_OUTPUT"

  build-lkm:
    needs: resolve-night-certificate
    uses: ./.github/workflows/build-lkm.yml
    with:
      expected_size: ${{ needs.resolve-night-certificate.outputs.expected_size }}
      expected_hash: ${{ needs.resolve-night-certificate.outputs.expected_hash }}
      package_name: 'com.Night.night'
      build_identity: 'Night-KMI-v2'
      build_x86: false
    secrets: inherit

  build-ksuinit:
    uses: ./.github/workflows/ksuinit.yml

  build-engine:
    needs: build-ksuinit
    uses: ./.github/workflows/ksud-extra.yml
    with:
      target: x86_64-unknown-linux-musl
      os: ubuntu-latest
      pack_lkm: false
      pack_ksuinit: true

  package:
    needs: [build-lkm, build-engine]
    runs-on: ubuntu-latest
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/download-artifact@v8
        with:
          name: ksud-x86_64-unknown-linux-musl
          path: engine
      - uses: actions/download-artifact@v8
        with:
          pattern: aarch64-android*-lkm
          merge-multiple: true
          path: kmi
      - name: Package native engine and exclusive KMI set
        run: |
          chmod +x engine/ksud
          mkdir bundle
          cp engine/ksud bundle/ksud
          cp kmi/*_kernelsu.ko bundle/
          (cd bundle && zip -9 ../night-web-engine.zip *)
      - name: Replace private draft engine release
        shell: bash
        run: |
          set -euo pipefail
          old_id="$(gh api "repos/$GITHUB_REPOSITORY/releases" --paginate --jq '.[] | select(.name=="Night Web Patch Engine") | .id' | head -n1 || true)"
          if [ -n "$old_id" ]; then gh api --method DELETE "repos/$GITHUB_REPOSITORY/releases/$old_id"; fi
          tag="night-web-engine-${GITHUB_SHA::12}-${GITHUB_RUN_ID}"
          gh release create "$tag" night-web-engine.zip --draft --title "Night Web Patch Engine" --notes "Private native engine used by the authenticated WTLYF web patch service."

