name: Build LKM for KernelSU
on:
  workflow_call:
    inputs:
      expected_size:
        description: 'Primary expected manager certificate size'
        required: false
        default: ''
        type: string
      expected_hash:
        description: 'Primary expected manager certificate SHA-256'
        required: false
        default: ''
        type: string
      expected_size2:
        description: 'Second expected signature size (for PR builds)'
        required: false
        default: ''
        type: string
      expected_hash2:
        description: 'Second expected signature hash (for PR builds)'
        required: false
        default: ''
        type: string
      manager_package:
        description: 'Exclusive manager package name'
        required: false
        default: ''
        type: string
      build_x86:
        description: 'Also build x86_64 modules'
        required: false
        default: false
        type: boolean
  workflow_dispatch:
jobs:
  build-lkm:
    strategy:
      matrix:
        kmi:
          - android12-5.10
          - android13-5.10
          - android13-5.15
          - android14-5.15
          - android14-6.1
          - android15-6.6
          - android16-6.12
          - android17-6.18
    uses: ./.github/workflows/ddk-lkm.yml
    with:
      kmi: ${{ matrix.kmi }}
      expected_size: ${{ inputs.expected_size || '' }}
      expected_hash: ${{ inputs.expected_hash || '' }}
      expected_size2: ${{ inputs.expected_size2 || '' }}
      expected_hash2: ${{ inputs.expected_hash2 || '' }}
      manager_package: ${{ inputs.manager_package || '' }}
      build_x86: ${{ inputs.build_x86 }}
