name: Build XhovoSU Exclusive KMI v1

on:
  workflow_dispatch:
  push:
    branches: [ "night" ]
    paths:
      - '.github/workflows/build-night-kmi.yml'
      - '.github/workflows/build-lkm.yml'
      - '.github/workflows/ddk-lkm.yml'
      - 'kernel/**'
      - 'uapi/**'

jobs:
  resolve-night-certificate:
    runs-on: ubuntu-latest
    outputs:
      expected_size: ${{ steps.cert.outputs.expected_size }}
      expected_hash: ${{ steps.cert.outputs.expected_hash }}
    steps:
      - name: Export Night signing certificate identity
        id: cert
        env:
          NIGHT_KEYSTORE: ${{ secrets.NIGHT_KEYSTORE }}
          NIGHT_KEYSTORE_PASSWORD: ${{ secrets.NIGHT_KEYSTORE_PASSWORD }}
          NIGHT_KEY_ALIAS: ${{ secrets.NIGHT_KEY_ALIAS }}
        run: |
          set -euo pipefail
          test -n "$NIGHT_KEYSTORE"
          test -n "$NIGHT_KEYSTORE_PASSWORD"
          test -n "$NIGHT_KEY_ALIAS"
          echo "$NIGHT_KEYSTORE" | base64 -d > night-key.jks
          keytool -exportcert -alias "$NIGHT_KEY_ALIAS" -keystore night-key.jks -storepass "$NIGHT_KEYSTORE_PASSWORD" -file night-cert.der
          size_dec=$(stat -c%s night-cert.der)
          echo "expected_size=$(printf '0x%04x' "$size_dec")" >> "$GITHUB_OUTPUT"
          echo "expected_hash=$(sha256sum night-cert.der | awk '{print $1}')" >> "$GITHUB_OUTPUT"

  build-night-kmi:
    needs: resolve-night-certificate
    uses: ./.github/workflows/build-lkm.yml
    with:
      expected_size: ${{ needs.resolve-night-certificate.outputs.expected_size }}
      expected_hash: ${{ needs.resolve-night-certificate.outputs.expected_hash }}
      package_name: 'com.HxovoSU.yydsHx'
      build_identity: 'XhovoSU-KMI-v1'
      build_x86: false

  package-night-kmi:
    needs: [resolve-night-certificate, build-night-kmi]
    runs-on: ubuntu-latest
    steps:
      - name: Download all ARM64 KMI modules
        uses: actions/download-artifact@v8
        with:
          pattern: aarch64-*-lkm
          path: XhovoSU-exclusive-KMI-v1
          merge-multiple: true

      - name: Create verification manifest
        working-directory: XhovoSU-exclusive-KMI-v1
        run: |
          {
            echo 'XhovoSU Exclusive KMI v1'
            echo 'Author: 无痛'
            echo 'Purpose: personal hobby development'
            echo 'Origin: XhovoSU exclusive derivative based on KernelSU'
            echo 'Manager package: com.HxovoSU.yydsHx'
            echo 'Manager certificate DER size: ${{ needs.resolve-night-certificate.outputs.expected_size }}'
            echo 'Manager certificate SHA-256: ${{ needs.resolve-night-certificate.outputs.expected_hash }}'
            echo 'Manager certificate DER size: ${{ needs.resolve-night-certificate.outputs.expected_size }}'
            echo 'Architecture: arm64'
            echo
            echo 'Each .ko is KMI-specific. Do not flash a module for a different Android/kernel KMI.'
            echo
            sha256sum *.ko
          } > MANIFEST.txt

      - name: Upload complete Night KMI suite
        uses: actions/upload-artifact@v7
        with:
          name: XhovoSU-exclusive-KMI-v1
          path: XhovoSU-exclusive-KMI-v1/*
