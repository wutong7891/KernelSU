name: Build wtlyf Toolbox

on:
  workflow_dispatch:
  push:
    branches: ["night"]
    paths:
      - '.github/workflows/build-wtlyf-toolbox.yml'
      - 'manager/wtlyf-toolbox/**'
      - 'manager/settings.gradle.kts'

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ./manager
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: 21
      - uses: gradle/actions/setup-gradle@v6
      - uses: android-actions/setup-android@v4

      - name: Write stable Night signing key
        env:
          NIGHT_KEYSTORE: ${{ secrets.NIGHT_KEYSTORE }}
          NIGHT_KEYSTORE_PASSWORD: ${{ secrets.NIGHT_KEYSTORE_PASSWORD }}
          NIGHT_KEY_ALIAS: ${{ secrets.NIGHT_KEY_ALIAS }}
          NIGHT_KEY_PASSWORD: ${{ secrets.NIGHT_KEY_PASSWORD }}
        run: |
          test -n "$NIGHT_KEYSTORE"
          echo "$NIGHT_KEYSTORE" | base64 -d > night-key.jks
          {
            echo KEYSTORE_PASSWORD="$NIGHT_KEYSTORE_PASSWORD"
            echo KEY_ALIAS="$NIGHT_KEY_ALIAS"
            echo KEY_PASSWORD="$NIGHT_KEY_PASSWORD"
            echo KEYSTORE_FILE=night-key.jks
          } >> gradle.properties

      - name: Build wtlyf
        run: ./gradlew :wtlyf-toolbox:assembleRelease

      - name: Upload APK
        uses: actions/upload-artifact@v7
        with:
          name: wtlyf-toolbox-apk
          path: manager/wtlyf-toolbox/build/outputs/apk/release/*.apk

  publish:
    needs: build
    if: ${{ github.event_name == 'push' && github.ref == 'refs/heads/night' }}
    runs-on: ubuntu-latest
    permissions:
      actions: read
      contents: write
    steps:
      - name: Checkout night
        uses: actions/checkout@v7
        with:
          ref: night
          fetch-depth: 0

      - name: Download toolbox APK
        uses: actions/download-artifact@v8
        with:
          name: wtlyf-toolbox-apk
          path: incoming-toolbox

      - name: Publish downloadable APK
        run: |
          rm -rf dist-wtlyf-toolbox
          mkdir -p dist-wtlyf-toolbox
          APK=$(find incoming-toolbox -type f -name '*.apk' | head -n 1)
          test -n "$APK"
          cp "$APK" dist-wtlyf-toolbox/wtlyf-toolbox.apk
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add dist-wtlyf-toolbox
          git commit -m "build: Publish wtlyf Toolbox APK"
          git pull --rebase origin night
          git push origin HEAD:night
