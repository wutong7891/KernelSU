name: Build wtlyf Toolbox

on:
  workflow_dispatch:
  push:
    branches: ["night"]
    paths:
      - '.github/workflows/build-wtlyf-toolbox.yml'
      - 'manager/wtlyf-toolbox/**'
      - 'manager/settings.gradle.kts'

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ./manager
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: 21
      - uses: gradle/actions/setup-gradle@v6
      - uses: android-actions/setup-android@v4

      - name: Write stable Night signing key
        env:
          NIGHT_KEYSTORE: ${{ secrets.NIGHT_KEYSTORE }}
          NIGHT_KEYSTORE_PASSWORD: ${{ secrets.NIGHT_KEYSTORE_PASSWORD }}
          NIGHT_KEY_ALIAS: ${{ secrets.NIGHT_KEY_ALIAS }}
          NIGHT_KEY_PASSWORD: ${{ secrets.NIGHT_KEY_PASSWORD }}
        run: |
          test -n "$NIGHT_KEYSTORE"
          echo "$NIGHT_KEYSTORE" | base64 -d > night-key.jks
          {
            echo KEYSTORE_PASSWORD="$NIGHT_KEYSTORE_PASSWORD"
            echo KEY_ALIAS="$NIGHT_KEY_ALIAS"
            echo KEY_PASSWORD="$NIGHT_KEY_PASSWORD"
            echo KEYSTORE_FILE=night-key.jks
          } >> gradle.properties

      - name: Build wtlyf
        run: ./gradlew :wtlyf-toolbox:assembleRelease

      - name: Upload APK
        uses: actions/upload-artifact@v7
        with:
          name: wtlyf-toolbox-apk
          path: manager/wtlyf-toolbox/build/outputs/apk/release/*.apk
